name: Compile FreeRunnerKernel

on:
  workflow_dispatch:
    inputs:
      build_reason:
        description: 'Tujuan Kompilasi (opsional)'
        required: false
        default: 'Re-build kernel-16'

jobs:
  build-kernel:
    name: Build Custom Kernel
    runs-on: ubuntu-22.04
    
    steps:
      - name: Sinkronisasi Repositori Target
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Inisialisasi Dependensi Lingkungan (Environment)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
          clang lld git curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi cgpt \
          cpio wget zip unzip zstd

      - name: Eksekusi Otomatisasi Skrip (build.sh)
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Ekstraksi Output (AnyKernel3 / Flashable Zip)
        uses: actions/upload-artifact@v4
        with:
          name: FreeRunnerKernel-Build-${{ github.run_id }}
          path: |
            *.zip
            AnyKernel3/*.zip
            out/**/*.zip
          retention-days: 7
