name: Build FreeRunnerKernel (kernel-16 / LineageOS 23)

on:
  workflow_dispatch:
  push:
    branches:
      - kernel-16

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y \
            git bc bison flex build-essential libssl-dev libncurses-dev \
            libtinfo-dev zip unzip lz4 ccache libglib2.0-0 python3 \
            python-is-python3 openjdk-11-jdk clang llvm lld gawk wget \
            curl xz-utils libelf-dev

      - name: Clone FreeRunnerKernel Source
        run: |
          git clone --recurse-submodules https://github.com/LeDrew2017/FreeRunnerKernel.git -b kernel-16 kernel-source

      - name: Download Toolchains (Proton-Clang & GCC)
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain/gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain/gcc32

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh

      - name: Prepare Root Custom Defconfig & Append Custom Configs
        run: |
          cd kernel-source
          
          # 1. Tentukan base defconfig dari file defconf di root repository
          if [ -f "../defconf" ]; then
            cp ../defconf arch/arm64/configs/custom_root_defconfig
          elif [ -f "defconf" ]; then
            cp defconf arch/arm64/configs/custom_root_defconfig
          else
            echo "ERROR: File defconf tidak ditemukan di root repository!"
            exit 1
          fi

          # 2. Sisipkan kustomisasi USB Gadget & ConfigFS ke dalam file defconfig
          cat << 'EOF' >> arch/arm64/configs/custom_root_defconfig

# =====================================================================
# CUSTOM BUILT-IN CONFIGS (USB GADGET, CONFIGFS, NETWORK, STORAGE)
# =====================================================================
CONFIG_CONFIGFS_FS=y
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_UEVENT=y
CONFIG_USB_F_FS=y
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_GADGETFS=y

CONFIG_USB_F_HID=y
CONFIG_USB_CONFIGFS_F_HID=y
CONFIG_USB_G_HID=y
CONFIG_HID_GENERIC=y
CONFIG_UHID=y
CONFIG_USB_F_CCID=y
CONFIG_USB_CONFIGFS_F_CCID=y

CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2=y
CONFIG_USB_F_UVC=y
CONFIG_USB_CONFIGFS_F_UVC=y

CONFIG_SND=y
CONFIG_SND_PCM=y
CONFIG_USB_F_UAC1=y
CONFIG_USB_CONFIGFS_F_UAC1=y
CONFIG_USB_F_UAC2=y
CONFIG_USB_CONFIGFS_F_UAC2=y

CONFIG_USB_F_MASS_STORAGE=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y

CONFIG_USB_F_RNDIS=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_F_ECM=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_F_SUBSET=y
CONFIG_USB_CONFIGFS_ECM_SUBSET=y
CONFIG_USB_F_NCM=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_F_EEM=y
CONFIG_USB_CONFIGFS_EEM=y

CONFIG_USB_F_SERIAL=y
CONFIG_USB_F_ACM=y
CONFIG_USB_CONFIGFS_SERIAL=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_ACM=y
CONFIG_USB_CONFIGFS_OBEX=y
CONFIG_USB_F_MIDI=y
CONFIG_USB_CONFIGFS_F_MIDI=y

CONFIG_USB_F_MTP=y
CONFIG_USB_CONFIGFS_F_MTP=y
CONFIG_USB_F_PTP=y
CONFIG_USB_CONFIGFS_F_PTP=y
CONFIG_USB_CONFIGFS_F_ADB=y

CONFIG_CRYPTO=y
CONFIG_CRYPTO_RSA=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_AES=y
CONFIG_USB_CONFIGFS_F_DM=y
CONFIG_USB_CONFIGFS_F_CONN_GADGET=y
CONFIG_USB_CONFIGFS_F_SS_MON_GADGET=y
# CONFIG_USB_G_ANDROID is not set
# CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE is not set
EOF

          echo "TARGET_DEFCONFIG=custom_root_defconfig" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          cd kernel-source
          
          export PATH="$(pwd)/../toolchain/proton-clang/bin:$(pwd)/../toolchain/gcc64/bin:$(pwd)/../toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "Mengompilasi kernel menggunakan defconfig: ${{ env.TARGET_DEFCONFIG }}"
          make O=out ${{ env.TARGET_DEFCONFIG }}
          make -j$(nproc --all) O=out

          if [ ! -f "out/arch/arm64/boot/Image" ] && [ ! -f "out/arch/arm64/boot/Image.lz4" ]; then
            echo "ERROR: Biner kernel (Image/Image.lz4) gagal dibuat!"
            exit 1
          fi

      - name: Package to AnyKernel3 Zip
        run: |
          cd AnyKernel3
          
          if [ -f "../kernel-source/out/arch/arm64/boot/Image.lz4" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.lz4 .
          elif [ -f "../kernel-source/out/arch/arm64/boot/Image" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image .
          fi

          if [ -f "../kernel-source/out/arch/arm64/boot/dtb.img" ]; then
            cp ../kernel-source/out/arch/arm64/boot/dtb.img dtb
          elif [ -f "../kernel-source/out/arch/arm64/boot/dtb" ]; then
            cp ../kernel-source/out/arch/arm64/boot/dtb .
          fi

          if [ -f "../kernel-source/out/arch/arm64/boot/dtbo.img" ]; then
            cp ../kernel-source/out/arch/arm64/boot/dtbo.img .
          fi

          ZIP_NAME="FreeRunnerKernel-Lineage23-beyond2lte-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: AnyKernel3/${{ env.ZIP_NAME }}
