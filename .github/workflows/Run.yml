name: Build FreeRunnerKernel (kernel-16 / LineageOS 23)

on:
  workflow_dispatch:
  push:
    branches:
      - kernel-16

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Root Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y \
            git bc bison flex build-essential libssl-dev libncurses-dev \
            libtinfo-dev zip unzip lz4 ccache libglib2.0-0 python3 \
            python-is-python3 openjdk-11-jdk clang llvm lld gawk wget \
            curl xz-utils libelf-dev

      - name: Clone FreeRunnerKernel Source
        run: |
          git clone --recurse-submodules https://github.com/LeDrew2017/FreeRunnerKernel.git -b kernel-16 kernel-source

      - name: Download Toolchains (Proton-Clang & GCC)
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain/gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain/gcc32

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh

      - name: Prepare Root Custom Defconfig & Append Custom Configs
        run: |
          # Cek lokasi file defconf di workspace root
          if [ -f "$GITHUB_WORKSPACE/defconf" ]; then
            cp "$GITHUB_WORKSPACE/defconf" kernel-source/arch/arm64/configs/custom_root_defconfig
          elif [ -f "defconf" ]; then
            cp defconf kernel-source/arch/arm64/configs/custom_root_defconfig
          else
            echo "File defconf tidak ditemukan di root, menggunakan fallback exynos9820_defconfig bawaan kernel..."
            if [ -f "kernel-source/arch/arm64/configs/beyond2lte_defconfig" ]; then
              cp kernel-source/arch/arm64/configs/beyond2lte_defconfig kernel-source/arch/arm64/configs/custom_root_defconfig
            elif [ -f "kernel-source/arch/arm64/configs/exynos9820_defconfig" ]; then
              cp kernel-source/arch/arm64/configs/exynos9820_defconfig kernel-source/arch/arm64/configs/custom_root_defconfig
            fi
          fi

          {
            echo "CONFIG_CONFIGFS_FS=y"
            echo "CONFIG_USB_GADGET=y"
            echo "CONFIG_USB_CONFIGFS=y"
            echo "CONFIG_USB_CONFIGFS_UEVENT=y"
            echo "CONFIG_USB_F_FS=y"
            echo "CONFIG_USB_CONFIGFS_F_FS=y"
            echo "CONFIG_USB_GADGETFS=y"
            echo "CONFIG_USB_F_HID=y"
            echo "CONFIG_USB_CONFIGFS_F_HID=y"
            echo "CONFIG_USB_G_HID=y"
            echo "CONFIG_HID_GENERIC=y"
            echo "CONFIG_UHID=y"
            echo "CONFIG_USB_F_CCID=y"
            echo "CONFIG_USB_CONFIGFS_F_CCID=y"
            echo "CONFIG_VIDEO_DEV=y"
            echo "CONFIG_VIDEO_V4L2=y"
            echo "CONFIG_USB_F_UVC=y"
            echo "CONFIG_USB_CONFIGFS_F_UVC=y"
            echo "CONFIG_SND=y"
            echo "CONFIG_SND_PCM=y"
            echo "CONFIG_USB_F_UAC1=y"
            echo "CONFIG_USB_CONFIGFS_F_UAC1=y"
            echo "CONFIG_USB_F_UAC2=y"
            echo "CONFIG_USB_CONFIGFS_F_UAC2=y"
            echo "CONFIG_USB_F_MASS_STORAGE=y"
            echo "CONFIG_USB_CONFIGFS_MASS_STORAGE=y"
            echo "CONFIG_USB_F_RNDIS=y"
            echo "CONFIG_USB_CONFIGFS_RNDIS=y"
            echo "CONFIG_USB_F_ECM=y"
            echo "CONFIG_USB_CONFIGFS_ECM=y"
            echo "CONFIG_USB_F_SUBSET=y"
            echo "CONFIG_USB_CONFIGFS_ECM_SUBSET=y"
            echo "CONFIG_USB_F_NCM=y"
            echo "CONFIG_USB_CONFIGFS_NCM=y"
            echo "CONFIG_USB_F_EEM=y"
            echo "CONFIG_USB_CONFIGFS_EEM=y"
            echo "CONFIG_USB_F_SERIAL=y"
            echo "CONFIG_USB_F_ACM=y"
            echo "CONFIG_USB_CONFIGFS_SERIAL=y"
            echo "CONFIG_USB_CONFIGFS_ACM=y"
            echo "CONFIG_USB_ACM=y"
            echo "CONFIG_USB_CONFIGFS_OBEX=y"
            echo "CONFIG_USB_F_MIDI=y"
            echo "CONFIG_USB_CONFIGFS_F_MIDI=y"
            echo "CONFIG_USB_F_MTP=y"
            echo "CONFIG_USB_CONFIGFS_F_MTP=y"
            echo "CONFIG_USB_F_PTP=y"
            echo "CONFIG_USB_CONFIGFS_F_PTP=y"
            echo "CONFIG_USB_CONFIGFS_F_ADB=y"
            echo "CONFIG_CRYPTO=y"
            echo "CONFIG_CRYPTO_RSA=y"
            echo "CONFIG_CRYPTO_SHA256=y"
            echo "CONFIG_CRYPTO_AES=y"
            echo "CONFIG_USB_CONFIGFS_F_DM=y"
            echo "CONFIG_USB_CONFIGFS_F_CONN_GADGET=y"
            echo "CONFIG_USB_CONFIGFS_F_SS_MON_GADGET=y"
          } >> kernel-source/arch/arm64/configs/custom_root_defconfig

          echo "TARGET_DEFCONFIG=custom_root_defconfig" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          cd kernel-source
          
          export PATH="$(pwd)/../toolchain/proton-clang/bin:$(pwd)/../toolchain/gcc64/bin:$(pwd)/../toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "Mengompilasi kernel menggunakan defconfig: ${{ env.TARGET_DEFCONFIG }}"
          make O=out ${{ env.TARGET_DEFCONFIG }}
          make -j$(nproc --all) O=out

          if [ ! -f "out/arch/arm64/boot/Image" ] && [ ! -f "out/arch/arm64/boot/Image.lz4" ]; then
            echo "ERROR: Biner kernel (Image/Image.lz4) gagal dibuat!"
            exit 1
          fi

      - name: Package to AnyKernel3 Zip
        run: |
          cd AnyKernel3
          
          if [ -f "../kernel-source/out/arch/arm64/boot/Image.lz4" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.lz4 .
          elif [ -f "../kernel-source/out/arch/arm64/boot/Image" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image .
          fi

          if [ -f "../kernel-source/out/arch/arm64/boot/dtb.img" ]; then
            cp ../kernel-source/out/arch/arm64/boot/dtb.img dtb
          elif [ -f "../kernel-source/out/arch/arm64/boot/dtb" ]; then
            cp ../kernel-source/out/arch/arm64/boot/dtb .
          fi

          if [ -f "../kernel-source/out/arch/arm64/boot/dtbo.img" ]; then
            cp ../kernel-source/out/arch/arm64/boot/dtbo.img .
          fi

          ZIP_NAME="FreeRunnerKernel-Lineage23-beyond2lte-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: AnyKernel3/${{ env.ZIP_NAME }}
