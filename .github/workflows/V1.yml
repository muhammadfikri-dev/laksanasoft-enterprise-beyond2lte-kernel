name: NetHunter beyond2lte V2 Extended Lite

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/v0lk3n/nethunter_kernel_samsung_exynos9820.git
  KERNEL_BRANCH: nethunter-lineage-23.2
  FREERUNNER_REPO: https://github.com/LeDrew2017/FreeRunnerKernel.git

  DEVICE: beyond2lte
  ARCH: arm64

  # NetHunter base configuration
  DEFCONFIG: nethunter_beyond2lte_defconfig

  # Device reference configuration
  REFERENCE_DEFCONFIG: exynos9820-beyond2lte_defconfig


jobs:

  build:

    name: NetHunter beyond2lte - Extended Kernel

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout workflow
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL TOOLCHAIN
      # ============================================================

      - name: Install build dependencies
        run: |

          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            device-tree-compiler \
            dwarves \
            pahole \
            cpio \
            rsync \
            zip \
            unzip \
            python3

          mkdir -p reports


      # ============================================================
      # 3. TOOLCHAIN REPORT
      # ============================================================

      - name: Toolchain report
        run: |

          {
            echo "===== TOOLCHAIN ====="
            clang --version
            echo
            llvm-config --version || true
            echo
            ld.lld --version
            echo
            aarch64-linux-gnu-gcc --version
            echo
            echo "===== CPU ====="
            nproc
            lscpu
            echo
            echo "===== MEMORY ====="
            free -h
            echo
            echo "===== DISK ====="
            df -h
          } 2>&1 | tee reports/00-toolchain.txt


      # ============================================================
      # 4. CLONE NETHUNTER
      # ============================================================

      - name: Clone NetHunter kernel
        run: |

          set -euxo pipefail

          git clone \
            --recursive \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          cd kernel

          git submodule sync --recursive
          git submodule update --init --recursive

          {
            echo "===== NETHUNTER ====="
            git remote -v
            git status
            git branch -a
            echo
            git rev-parse HEAD
            echo
            git log -1 --oneline --decorate
          } 2>&1 | tee ../reports/01-nethunter-source.txt


      # ============================================================
      # 5. CLONE FREERUNNER
      # ============================================================

      - name: Clone FreeRunnerKernel
        run: |

          set -euxo pipefail

          git clone \
            --recursive \
            "${FREERUNNER_REPO}" \
            freerunner

          cd freerunner

          {
            echo "===== FREERUNNER ====="
            git remote -v
            git status
            git branch -a
            echo
            git rev-parse HEAD
            echo
            git log -1 --oneline --decorate
          } 2>&1 | tee ../reports/02-freerunner-source.txt


      # ============================================================
      # 6. SOURCE INVENTORY
      # ============================================================

      - name: Source inventory
        run: |

          {
            echo "===== BEYOND2LTE DEFCONFIGS ====="

            find kernel/arch/arm64/configs \
              -type f \
              | grep -Ei \
                'beyond2lte|exynos9820' \
              | sort

            echo
            echo "===== KERNEL BUILDER ====="

            find kernel/kali-nethunter-kernel-builder \
              -maxdepth 4 \
              -type f \
              | sort

            echo
            echo "===== ANYKERNEL ====="

            find kernel \
              -type f \
              \( \
                -name 'anykernel.sh' \
                -o \
                -iname '*anykernel*' \
                -o \
                -iname '*mkbootimg*' \
              \) \
              | sort

          } 2>&1 | tee reports/03-source-inventory.txt


      # ============================================================
      # 7. VERIFY DEFCONFIG
      # ============================================================

      - name: Verify defconfigs
        working-directory: kernel
        run: |

          set -e

          test -f \
            "arch/arm64/configs/${DEFCONFIG}"

          test -f \
            "arch/arm64/configs/${REFERENCE_DEFCONFIG}"

          {
            echo "Primary:"
            echo "${DEFCONFIG}"

            echo
            echo "Reference:"
            echo "${REFERENCE_DEFCONFIG}"

            echo
            echo "All related:"
            find arch/arm64/configs \
              -type f \
              | grep -Ei \
                'beyond2lte|exynos9820' \
              | sort

          } 2>&1 | tee ../reports/04-defconfig.txt


      # ============================================================
      # 8. CREATE COMPACT FEATURE FRAGMENT
      # ============================================================

      - name: Create extended feature configuration
        run: |

          mkdir -p kernel/custom-config

          cat > kernel/custom-config/nethunter-extended.config <<'EOF'

# ==============================================================
# NetHunter beyond2lte Extended Feature Fragment
# ==============================================================


# --------------------------------------------------------------
# Namespaces / Containers
# --------------------------------------------------------------

CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y


# --------------------------------------------------------------
# Cgroups
# --------------------------------------------------------------

CONFIG_CGROUPS=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_CPUACCT=y


# --------------------------------------------------------------
# Container storage
# --------------------------------------------------------------

CONFIG_OVERLAY_FS=y
CONFIG_FUSE_FS=y


# --------------------------------------------------------------
# Core filesystems
# --------------------------------------------------------------

CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

CONFIG_TMPFS=y

CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_CONFIGFS_FS=y

CONFIG_EXT4_FS=y
CONFIG_F2FS_FS=y

CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_LZ4=y


# --------------------------------------------------------------
# Block/container support
# --------------------------------------------------------------

CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_CRYPT=y
CONFIG_DM_SNAPSHOT=y
CONFIG_DM_VERITY=y


# --------------------------------------------------------------
# Networking
# --------------------------------------------------------------

CONFIG_NET=y
CONFIG_INET=y
CONFIG_IPV6=y

CONFIG_PACKET=y
CONFIG_UNIX=y

CONFIG_VETH=y
CONFIG_TUN=y
CONFIG_TAP=y

CONFIG_MACVLAN=y
CONFIG_MACVTAP=y

CONFIG_DUMMY=y
CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y

CONFIG_VLAN_8021Q=y
CONFIG_IPVLAN=y


# --------------------------------------------------------------
# Netfilter / NAT
# --------------------------------------------------------------

CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NETFILTER_XTABLES=y

CONFIG_NF_CONNTRACK=y
CONFIG_NF_NAT=y

CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_IP_NF_TARGET_REDIRECT=y

CONFIG_IP6_NF_IPTABLES=y
CONFIG_IP6_NF_FILTER=y


# --------------------------------------------------------------
# HID
# --------------------------------------------------------------

CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y

CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_HIDRAW=y
CONFIG_UHID=y


# --------------------------------------------------------------
# USB Gadget / ConfigFS
# --------------------------------------------------------------

CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_UEVENT=y

CONFIG_USB_F_FS=y
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_GADGETFS=y


# --------------------------------------------------------------
# USB HID / FIDO foundation
# --------------------------------------------------------------

CONFIG_USB_F_HID=y
CONFIG_USB_CONFIGFS_F_HID=y
CONFIG_USB_G_HID=y


# --------------------------------------------------------------
# USB CCID
# --------------------------------------------------------------

CONFIG_USB_F_CCID=y
CONFIG_USB_CONFIGFS_F_CCID=y


# --------------------------------------------------------------
# USB Mass Storage
# --------------------------------------------------------------

CONFIG_USB_F_MASS_STORAGE=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y


# --------------------------------------------------------------
# USB networking
# --------------------------------------------------------------

CONFIG_USB_F_RNDIS=y
CONFIG_USB_CONFIGFS_RNDIS=y

CONFIG_USB_F_ECM=y
CONFIG_USB_CONFIGFS_ECM=y

CONFIG_USB_F_NCM=y
CONFIG_USB_CONFIGFS_NCM=y

CONFIG_USB_F_EEM=y
CONFIG_USB_CONFIGFS_EEM=y


# --------------------------------------------------------------
# USB Serial
# --------------------------------------------------------------

CONFIG_USB_F_SERIAL=y
CONFIG_USB_F_ACM=y

CONFIG_USB_CONFIGFS_SERIAL=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_ACM=y


# --------------------------------------------------------------
# Android USB
# --------------------------------------------------------------

CONFIG_USB_CONFIGFS_F_ADB=y

CONFIG_USB_F_MTP=y
CONFIG_USB_CONFIGFS_F_MTP=y

CONFIG_USB_F_PTP=y
CONFIG_USB_CONFIGFS_F_PTP=y


# --------------------------------------------------------------
# Crypto
# --------------------------------------------------------------

CONFIG_CRYPTO=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_RSA=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_SHA1=y
CONFIG_CRYPTO_HMAC=y
CONFIG_CRYPTO_CTR=y
CONFIG_CRYPTO_CBC=y


# --------------------------------------------------------------
# Keys / security
# --------------------------------------------------------------

CONFIG_KEYS=y
CONFIG_SECURITY=y
CONFIG_SECURITYFS=y


# --------------------------------------------------------------
# BPF
# --------------------------------------------------------------

CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y


# --------------------------------------------------------------
# Network filesystem
# --------------------------------------------------------------

CONFIG_NFS_FS=y
CONFIG_NFS_V3=y
CONFIG_NFS_V4=y
CONFIG_CIFS=y


# --------------------------------------------------------------
# Kernel modules
# --------------------------------------------------------------

CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y

EOF

          cp \
            kernel/custom-config/nethunter-extended.config \
            reports/05-feature-fragment.txt


      # ============================================================
      # 9. CONFIGURE BASE
      # ============================================================

      - name: Configure NetHunter base
        working-directory: kernel
        run: |

          set -e

          rm -rf out
          mkdir -p out

          {
            echo "===== BASE DEFCONFIG ====="

            make \
              O=out \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              "${DEFCONFIG}"

          } 2>&1 | tee ../reports/06-base-config.txt

          cp \
            out/.config \
            ../reports/base.config


      # ============================================================
      # 10. MERGE EXTENDED CONFIG
      # ============================================================

      - name: Merge extended configuration
        working-directory: kernel
        run: |

          set -e

          chmod +x scripts/kconfig/merge_config.sh

          {
            echo "===== MERGE CONFIG ====="

            scripts/kconfig/merge_config.sh \
              -m \
              -O out \
              out/.config \
              custom-config/nethunter-extended.config

            echo
            echo "===== OLDDEFCONFIG ====="

            make \
              O=out \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              olddefconfig

          } 2>&1 | tee ../reports/07-merge-config.txt

          cp \
            out/.config \
            ../reports/final.config


      # ============================================================
      # 11. CONFIG VALIDATION
      # ============================================================

      - name: Validate final configuration
        working-directory: kernel
        run: |

          {
            echo "===== CONTAINER ====="

            grep -E \
              'CONFIG_(NAMESPACES|USER_NS|UTS_NS|IPC_NS|PID_NS|NET_NS|CGROUP|OVERLAY_FS)' \
              out/.config \
              || true

            echo
            echo "===== NETWORK ====="

            grep -E \
              'CONFIG_(VETH|TUN|TAP|BRIDGE|MACVLAN|MACVTAP|IPVLAN|NETFILTER|NF_CONNTRACK|NF_NAT|IP_NF)' \
              out/.config \
              || true

            echo
            echo "===== USB/FIDO ====="

            grep -E \
              'CONFIG_(USB_GADGET|USB_CONFIGFS|USB_F_HID|USB_G_HID|USB_CONFIGFS_F_HID|HID|UHID|USB_F_CCID)' \
              out/.config \
              || true

            echo
            echo "===== FILESYSTEM ====="

            grep -E \
              'CONFIG_(OVERLAY_FS|FUSE_FS|EXT4_FS|F2FS_FS|SQUASHFS|BLK_DEV_LOOP|BLK_DEV_DM)' \
              out/.config \
              || true

            echo
            echo "===== CRYPTO ====="

            grep -E \
              'CONFIG_(CRYPTO|KEYS|SECURITY)' \
              out/.config \
              | head -200 \
              || true

          } 2>&1 | tee ../reports/08-final-config-validation.txt


      # ============================================================
      # 12. COMPARE REQUESTED OPTIONS
      # ============================================================

      - name: Configuration acceptance report
        working-directory: kernel
        run: |

          {
            echo "===== REQUESTED VS FINAL ====="
            echo

            while read -r line; do

              case "$line" in

                CONFIG_*=*)

                  key="${line%%=*}"
                  requested="${line#*=}"

                  final="$(grep -E "^${key}=" out/.config | head -1 || true)"

                  if [ -z "$final" ]; then
                    final="NOT_PRESENT"
                  fi

                  printf "%-45s requested=%-8s final=%s\n" \
                    "$key" \
                    "$requested" \
                    "$final"

                  ;;

              esac

            done < custom-config/nethunter-extended.config

          } 2>&1 | tee ../reports/09-config-acceptance.txt


      # ============================================================
      # 13. BUILD
      # ============================================================

      - name: Build kernel with Clang
        working-directory: kernel
        shell: bash
        run: |

          set -o pipefail

          START=$(date +%s)

          {
            echo "========================================"
            echo "KERNEL BUILD"
            echo "========================================"

            echo "Start:"
            date -u

            echo
            echo "Compiler:"
            clang --version

            echo
            echo "CPU:"
            nproc

            echo
            echo "Memory:"
            free -h

            echo
            echo "Starting build..."

          } | tee ../reports/10-build-start.txt

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            V=1 \
            2>&1 | tee ../reports/11-build-full.log

          END=$(date +%s)
          ELAPSED=$((END-START))

          {
            echo
            echo "========================================"
            echo "BUILD FINISHED"
            echo "========================================"

            echo "End:"
            date -u

            echo
            echo "Build time:"
            echo "${ELAPSED} seconds"

            echo
            echo "Build time:"
            printf '%02d:%02d:%02d\n' \
              $((ELAPSED/3600)) \
              $(((ELAPSED%3600)/60)) \
              $((ELAPSED%60))

          } | tee ../reports/12-build-result.txt


      # ============================================================
      # 14. BUILD STATISTICS
      # ============================================================

      - name: Generate build statistics
        working-directory: kernel
        run: |

          {
            echo "===== OBJECT FILE COUNT ====="

            find out \
              -type f \
              -name '*.o' \
              | wc -l

            echo
            echo "===== MODULE COUNT ====="

            find out \
              -type f \
              -name '*.ko' \
              | wc -l

            echo
            echo "===== DTB COUNT ====="

            find out \
              -type f \
              -name '*.dtb' \
              | wc -l

            echo
            echo "===== DTBO COUNT ====="

            find out \
              -type f \
              -name '*.dtbo' \
              | wc -l

            echo
            echo "===== KERNEL FILES ====="

            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              -exec ls -lh {} \; \
              || true

            echo
            echo "===== TOTAL BUILD DIRECTORY ====="

            du -sh out

            echo
            echo "===== LARGEST OUTPUT FILES ====="

            find out \
              -type f \
              -printf '%s %p\n' \
              | sort -nr \
              | head -30

          } 2>&1 | tee ../reports/13-build-statistics.txt


      # ============================================================
      # 15. KERNEL IMAGE ANALYSIS
      # ============================================================

      - name: Analyze kernel images
        working-directory: kernel
        run: |

          {
            echo "===== KERNEL IMAGES ====="

            find out/arch/arm64/boot \
              -type f \
              \( \
                -name 'Image' \
                -o \
                -name 'Image.gz' \
                -o \
                -name 'Image.gz-dtb' \
                -o \
                -name 'Image.lz4' \
                -o \
                -name 'Image.lz4-dtb' \
              \) \
              -exec file {} \; \
              -exec sha256sum {} \; \
              -exec ls -lh {} \;

            echo
            echo "===== VMLINUX ====="

            if [ -f out/vmlinux ]; then

              file out/vmlinux
              ls -lh out/vmlinux
              sha256sum out/vmlinux

            fi
