
name: NetHunter beyond2lte V2 - Kernel Build

on:
  workflow_dispatch:

env:
  ARCH: arm64
  DEFCONFIG: nethunter_beyond2lte_defconfig
  KERNEL_SRC: kernel
  OUT: out

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. DEPENDENCIES
      # ==========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            dwarves \
            pahole \
            cpio \
            rsync \
            zip \
            unzip \
            gzip \
            xz-utils \
            lz4 \
            zstd \
            python3 \
            file

      # ==========================================================
      # 2. HOST REPORT
      # ==========================================================
      - name: Create host report
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          {
            echo "=========================================="
            echo "HOST INFORMATION"
            echo "=========================================="
            date
            uname -a

            echo
            echo "CPU"
            nproc
            lscpu

            echo
            echo "MEMORY"
            free -h

            echo
            echo "DISK"
            df -h

            echo
            echo "CLANG"
            clang --version

            echo
            echo "LLVM"
            llvm-config --version

            echo
            echo "AARCH64 GCC"
            aarch64-linux-gnu-gcc --version

          } 2>&1 | tee reports/00-host.log

      # ==========================================================
      # 3. CLONE NETHUNTER
      # ==========================================================
      - name: Clone NetHunter kernel source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch nethunter-lineage-23.2 \
            --recurse-submodules \
            https://github.com/v0lk3n/nethunter_kernel_samsung_exynos9820.git \
            "$KERNEL_SRC"

          cd "$KERNEL_SRC"

          {
            echo "=========================================="
            echo "SOURCE INFORMATION"
            echo "=========================================="

            echo "Commit:"
            git rev-parse HEAD

            echo
            echo "Branch:"
            git branch --show-current

            echo
            echo "Top level:"
            find . -maxdepth 1 -type f -printf '%f\n' | sort

          } 2>&1 | tee ../reports/01-source.log

      # ==========================================================
      # 4. FIND DEFCONFIG
      # ==========================================================
      - name: Verify beyond2lte defconfig
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_SRC"

          {
            echo "=========================================="
            echo "DEFCONFIG SEARCH"
            echo "=========================================="

            find arch/arm64/configs \
              -type f \
              \( \
                -iname '*beyond2lte*' \
                -o \
                -iname '*exynos9820*' \
              \) \
              -print \
              | sort

            echo
            echo "Target:"
            echo "$DEFCONFIG"

            test -f "arch/arm64/configs/$DEFCONFIG"

          } 2>&1 | tee ../reports/02-defconfig.log

      # ==========================================================
      # 5. INITIAL DEFCONFIG
      # ==========================================================
      - name: Generate base kernel config
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_SRC"

          rm -rf "$OUT"
          mkdir -p "$OUT"
          mkdir -p ../reports/config

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG" \
            2>&1 | tee ../reports/config/00-defconfig.log

          cp "$OUT/.config" \
            ../reports/config/base.config

      # ==========================================================
      # 6. CREATE SAFE CONFIG FRAGMENT
      #
      # IMPORTANT:
      # We use printf instead of raw CONFIG_* YAML lines.
      # This prevents GitHub from interpreting CONFIG_NAMESPACES
      # as YAML syntax.
      # ==========================================================
      - name: Create NetHunter feature config
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_SRC"

          mkdir -p "$OUT"

          CONFIG="$OUT/nethunter.fragment"

          rm -f "$CONFIG"

          printf '%s\n' \
          '# NetHunter extended configuration' \
          '' \
          '# Namespaces' \
          'CONFIG_NAMESPACES=y' \
          'CONFIG_UTS_NS=y' \
          'CONFIG_IPC_NS=y' \
          'CONFIG_PID_NS=y' \
          'CONFIG_NET_NS=y' \
          'CONFIG_USER_NS=y' \
          '' \
          '# Cgroups' \
          'CONFIG_CGROUPS=y' \
          'CONFIG_CGROUP_SCHED=y' \
          'CONFIG_CGROUP_DEVICE=y' \
          'CONFIG_CGROUP_FREEZER=y' \
          'CONFIG_CGROUP_CPUACCT=y' \
          '' \
          '# Filesystem' \
          'CONFIG_DEVTMPFS=y' \
          'CONFIG_DEVTMPFS_MOUNT=y' \
          'CONFIG_TMPFS=y' \
          'CONFIG_PROC_FS=y' \
          'CONFIG_SYSFS=y' \
          'CONFIG_CONFIGFS_FS=y' \
          'CONFIG_EXT4_FS=y' \
          'CONFIG_F2FS_FS=y' \
          'CONFIG_SQUASHFS=y' \
          'CONFIG_OVERLAY_FS=y' \
          'CONFIG_FUSE_FS=y' \
          '' \
          '# Block' \
          'CONFIG_BLK_DEV_LOOP=y' \
          'CONFIG_BLK_DEV_DM=y' \
          'CONFIG_DM_CRYPT=y' \
          'CONFIG_DM_SNAPSHOT=y' \
          'CONFIG_DM_VERITY=y' \
          '' \
          '# Network' \
          'CONFIG_NET=y' \
          'CONFIG_INET=y' \
          'CONFIG_IPV6=y' \
          'CONFIG_PACKET=y' \
          'CONFIG_UNIX=y' \
          'CONFIG_VETH=y' \
          'CONFIG_TUN=y' \
          'CONFIG_MACVLAN=y' \
          'CONFIG_MACVTAP=y' \
          'CONFIG_DUMMY=y' \
          'CONFIG_BRIDGE=y' \
          'CONFIG_BRIDGE_NETFILTER=y' \
          'CONFIG_VLAN_8021Q=y' \
          'CONFIG_IPVLAN=y' \
          '' \
          '# Netfilter' \
          'CONFIG_NETFILTER=y' \
          'CONFIG_NETFILTER_ADVANCED=y' \
          'CONFIG_NF_CONNTRACK=y' \
          'CONFIG_NF_NAT=y' \
          'CONFIG_NETFILTER_XTABLES=y' \
          'CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y' \
          'CONFIG_NETFILTER_XT_TARGET_REDIRECT=y' \
          'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y' \
          'CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y' \
          'CONFIG_NETFILTER_XT_MATCH_STATE=y' \
          '' \
          '# HID' \
          'CONFIG_HID=y' \
          'CONFIG_HIDRAW=y' \
          'CONFIG_UHID=y' \
          '' \
          '# USB Gadget' \
          'CONFIG_USB_GADGET=y' \
          'CONFIG_USB_CONFIGFS=y' \
          'CONFIG_USB_CONFIGFS_F_FS=y' \
          'CONFIG_USB_F_HID=y' \
          'CONFIG_USB_G_HID=y' \
          '' \
          '# USB networking' \
          'CONFIG_USB_CONFIGFS_RNDIS=y' \
          'CONFIG_USB_CONFIGFS_ECM=y' \
          'CONFIG_USB_CONFIGFS_NCM=y' \
          '' \
          '# USB storage' \
          'CONFIG_USB_CONFIGFS_MASS_STORAGE=y' \
          '' \
          '# USB serial' \
          'CONFIG_USB_ACM=y' \
          '' \
          '# Crypto' \
          'CONFIG_CRYPTO=y' \
          'CONFIG_CRYPTO_AES=y' \
          'CONFIG_CRYPTO_SHA1=y' \
          'CONFIG_CRYPTO_SHA256=y' \
          'CONFIG_CRYPTO_HMAC=y' \
          'CONFIG_CRYPTO_CTR=y' \
          'CONFIG_CRYPTO_CBC=y' \
          '' \
          '# Keys' \
          'CONFIG_KEYS=y' \
          '' \
          '# Kernel modules' \
          'CONFIG_MODULES=y' \
          'CONFIG_MODULE_UNLOAD=y' \
          > "$CONFIG"

          cp "$CONFIG" \
            ../reports/config/requested.fragment

          echo "===== REQUESTED CONFIG ====="
          cat "$CONFIG" \
            | tee ../reports/config/01-requested-config.log

      # ==========================================================
      # 7. MERGE CONFIG
      # ==========================================================
      - name: Merge NetHunter config
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_SRC"

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT" \
            "$OUT/.config" \
            "$OUT/nethunter.fragment" \
            2>&1 | tee ../reports/config/02-merge.log

      # ==========================================================
      # 8. OLDDEFCONFIG
      # ==========================================================
      - name: Resolve kernel configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_SRC"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig \
            2>&1 | tee ../reports/config/03-olddefconfig.log

          cp "$OUT/.config" \
            ../reports/config/final.config

      # ==========================================================
      # 9. CONFIG VERIFICATION
      # ==========================================================
      - name: Verify final configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_SRC"

          {
            echo "=========================================="
            echo "FINAL CONFIGURATION"
            echo "=========================================="

            echo
            echo "Namespaces:"
            grep -E '^CONFIG_(NAMESPACES|UTS_NS|IPC_NS|PID_NS|NET_NS|USER_NS)=' \
              "$OUT/.config" || true

            echo
            echo "Cgroups:"
            grep -E '^CONFIG_CGROUP' \
              "$OUT/.config" || true

            echo
            echo "Containers:"
            grep -E '^CONFIG_(OVERLAY_FS|FUSE_FS)=' \
              "$OUT/.config" || true

            echo
            echo "Network:"
            grep -E '^CONFIG_(VETH|TUN|MACVLAN|MACVTAP|BRIDGE|BRIDGE_NETFILTER|VLAN_8021Q|IPVLAN)=' \
              "$OUT/.config" || true

            echo
            echo "Netfilter:"
            grep -E '^CONFIG_(NETFILTER|NF_CONNTRACK|NF_NAT|NETFILTER_XT)' \
              "$OUT/.config" || true

            echo
            echo "USB:"
            grep -E '^CONFIG_(USB_GADGET|USB_CONFIGFS|USB_F_HID|USB_G_HID|USB_CONFIGFS_RNDIS|USB_CONFIGFS_ECM|USB_CONFIGFS_NCM)' \
              "$OUT/.config" || true

            echo
            echo "HID:"
            grep -E '^CONFIG_(HID|HIDRAW|UHID)=' \
              "$OUT/.config" || true

            echo
            echo "Crypto:"
            grep -E '^CONFIG_CRYPTO' \
              "$OUT/.config" || true

          } 2>&1 | tee ../reports/config/04-final-config.log

      # ==========================================================
      # 10. BUILD KERNEL
      # ==========================================================
      - name: Compile kernel
        shell: bash
        run: |
          set -o pipefail

          cd "$KERNEL_SRC"

          mkdir -p ../reports/build

          START=$(date +%s)

          echo "=========================================="
          echo "KERNEL BUILD START"
          echo "=========================================="
          date

          make \
            -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            V=1 \
            2>&1 | tee ../reports/build/00-full-build.log

          RESULT=${PIPESTATUS[0]}

          END=$(date +%s)
          ELAPSED=$((END - START))

          echo
          echo "BUILD EXIT CODE: $RESULT"
          echo "BUILD TIME: ${ELAPSED} seconds"

          echo "$RESULT" > ../reports/build/build-exit-code.txt
          echo "$ELAPSED" > ../reports/build/build-time-seconds.txt

          exit "$RESULT"

      # ==========================================================
      # 11. KERNEL OUTPUT REPORT
      # ==========================================================
      - name: Analyze kernel output
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_SRC"

          mkdir -p ../reports/output

          {
            echo "=========================================="
            echo "KERNEL OUTPUT"
            echo "=========================================="

            echo
            echo "Kernel images:"

            find "$OUT/arch/arm64/boot" \
              -maxdepth 2 \
              -type f \
              -printf '%p %s bytes\n' \
              2>/dev/null \
              | sort || true

            echo
            echo "Image files:"

            for f in \
              "$OUT/arch/arm64/boot/Image" \
              "$OUT/arch/arm64/boot/Image.gz" \
              "$OUT/arch/arm64/boot/Image.lz4" \
              "$OUT/arch/arm64/boot/Image.gz-dtb" \
              "$OUT/arch/arm64/boot/Image.lz4-dtb" \
              "$OUT/vmlinux" \
              "$OUT/System.map"
            do
              if [ -f "$f" ]; then
                echo
                echo "FILE: $f"
                ls -lh "$f"
                file "$f"
                sha256sum "$f"
              fi
            done

          } 2>&1 | tee ../reports/output/00-kernel-output.log

      # ==========================================================
      # 12. DTB / DTBO
      # ==========================================================
      - name: Analyze DTB and DTBO
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_SRC"

          {
            echo "=========================================="
            echo "DTB / DTBO"
            echo "=========================================="

            find "$OUT" \
              \( -name '*.dtb' -o -name '*.dtbo' \) \
              -type f \
              -printf '%p %s bytes\n' \
              2>/dev/null \
              | sort || true

          } 2>&1 | tee ../reports/output/01-dtb.log

      # ==========================================================
      # 13. MODULES
      # ==========================================================
      - name: Collect kernel modules
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_SRC"

          mkdir -p ../reports/modules

          find "$OUT" \
            -type f \
            -name '*.ko' \
            -print \
            | sort \
            > ../reports/modules/modules.list

          {
            echo "Module count:"
            wc -l ../reports/modules/modules.list

            echo
            echo "Modules:"
            cat ../reports/modules/modules.list

          } | tee ../reports/modules/modules.log

      # ==========================================================
      # 14. WARNINGS / ERRORS
      # ==========================================================
      - name: Build diagnostics
        if: always()
        shell: bash
        run: |
          set -e

          mkdir -p reports/diagnostics

          if [ -f reports/build/00-full-build.log ]; then

            grep -Ei \
              'warning:|error:|fatal error:|undefined reference|No rule to make target' \
              reports/build/00-full-build.log \
              > reports/diagnostics/compiler-errors-warnings.log \
              || true

            echo "Diagnostic lines:"
            wc -l reports/diagnostics/compiler-errors-warnings.log || true

          fi

      # ==========================================================
      # 15. COLLECT ACTUAL KERNEL FILES
      # ==========================================================
      - name: Collect kernel artifacts
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release/kernel
          mkdir -p release/dtb
          mkdir -p release/modules
          mkdir -p release/config
          mkdir -p release/logs

          # Kernel images
          find "$KERNEL_SRC/$OUT/arch/arm64/boot" \
            -maxdepth 1 \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.gz' \
              -o -name 'Image.lz4' \
              -o -name 'Image.gz-dtb' \
              -o -name 'Image.lz4-dtb' \
            \) \
            -exec cp -v {} release/kernel/ \; \
            || true

          # DTB / DTBO
          find "$KERNEL_SRC/$OUT" \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp -v {} release/dtb/ \; \
            || true

          # Modules
          find "$KERNEL_SRC/$OUT" \
            -type f \
            -name '*.ko' \
            -exec cp -v {} release/modules/ \; \
            || true

          # Config
          cp "$KERNEL_SRC/$OUT/.config" \
            release/config/final.config

          cp "$KERNEL_SRC/$OUT/nethunter.fragment" \
            release/config/nethunter.fragment

          # Logs
          cp -r reports/* release/logs/

          # Metadata
          {
            echo "Target: Samsung Galaxy S10+ Exynos 9820"
            echo "Codename: beyond2lte"
            echo "Kernel branch: nethunter-lineage-23.2"
            echo "Defconfig: $DEFCONFIG"
            echo "Architecture: $ARCH"
            echo "Compiler: clang/LLVM"
            echo "Date: $(date)"
            echo
            echo "Kernel files:"
            find release/kernel -type f -printf '%f %s bytes\n' | sort
            echo
            echo "DTB/DTBO:"
            find release/dtb -type f -printf '%f %s bytes\n' | sort
            echo
            echo "Modules:"
            find release/modules -type f -printf '%f %s bytes\n' | sort
          } > release/BUILD_INFO.txt

      # ==========================================================
      # 16. ZIP RESULT
      # ==========================================================
      - name: Create kernel result ZIP
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          cd release

          zip -r \
            ../NetHunter-beyond2lte-V2-KERNEL.zip \
            kernel \
            dtb \
            modules \
            config \
            BUILD_INFO.txt

      # ==========================================================
      # 17. COMPRESS REPORTS
      # ==========================================================
      - name: Create reports archive
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          tar -czf \
            NetHunter-beyond2lte-V2-REPORTS.tar.gz \
            reports

      # ==========================================================
      # 18. UPLOAD KERNEL
      # ==========================================================
      - name: Upload compiled kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-beyond2lte-V2-KERNEL
          path: |
            NetHunter-beyond2lte-V2-KERNEL.zip
          retention-days: 14
